# Draws the contribution "snake" every day and publishes it to the `output` branch,
# which the profile README shows.
name: Generate snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C8792C&color_dots=#ebedf0,#F4D9A0,#E0A866,#C8792C,#8A4F18
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C8792C&color_dots=#2a211a,#5B4632,#8a6440,#C8792C,#F4D9A0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
